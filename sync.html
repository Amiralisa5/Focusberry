<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11131a">
<title>Focusberry Sync</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11131a;font-family:system-ui,-apple-system,sans-serif}iframe{border:0;width:100%;height:100%;display:block}.panel{position:fixed;z-index:10;top:16px;right:16px;width:min(360px,calc(100vw - 32px));background:#fff;border-radius:16px;padding:20px;box-shadow:0 16px 50px #0005;color:#171923}.panel h2{margin:0 0 6px}.panel p{margin:6px 0 14px;color:#667085;font-size:13px}.panel input{display:block;width:100%;box-sizing:border-box;padding:11px;margin:8px 0;border:1px solid #ddd;border-radius:9px}.panel button{width:100%;padding:11px;margin-top:7px;border:0;border-radius:9px;background:#5b5bd6;color:#fff;font-weight:700;cursor:pointer}.panel button.secondary{background:#eef0f5;color:#292d39}.status{font-size:12px;margin-top:10px}.ok{color:#15803d}.err{color:#b91c1c}.user{display:flex;justify-content:space-between;gap:8px;align-items:center}.hidden{display:none!important}
</style>
</head>
<body>
<iframe id="app" src="./index.html" title="Focusberry"></iframe>
<div id="panel" class="panel">
  <h2>☁️ Focusberry Cloud</h2>
  <p>Sign in to sync your tasks and daily records across devices. Your existing local data stays on this device until you choose to upload it.</p>
  <div id="auth">
    <input id="email" type="email" autocomplete="email" placeholder="Email">
    <input id="password" type="password" autocomplete="current-password" placeholder="Password (8+ characters)">
    <button onclick="registerUser()">Create account</button>
    <button class="secondary" onclick="loginUser()">Sign in</button>
  </div>
  <div id="account" class="hidden">
    <div class="user"><strong id="accountEmail"></strong><button class="secondary" style="width:auto;padding:7px 10px;margin:0" onclick="logout()">Sign out</button></div>
    <button onclick="syncNow()">Sync now</button>
  </div>
  <div id="status" class="status">Local-only mode</div>
</div>
<script src="./sync.js"></script>
</body>
</html>
