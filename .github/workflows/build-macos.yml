name: Build Focusberry macOS

# macOS builds are intentionally manual. Focusberry is built locally on an
# Apple Silicon MacBook, so normal pushes do not consume GitHub Actions runs.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app
        run: |
          set -euo pipefail
          bash scripts/build-macos.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Focusberry-macOS-arm64
          path: |
            build/Focusberry.app
            build/Focusberry.dmg
