name: Fix Focusberry PWA entrypoint

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('manifest.json')
          data = json.loads(p.read_text())
          data['start_url'] = './index.html'
          data['scope'] = './'
          p.write_text(json.dumps(data, indent=2) + '\n')
          p = Path('sw.js')
          s = p.read_text().replace("const CACHE = 'focusberry-v2';", "const CACHE = 'focusberry-v3';")
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'chore(pwa): normalize entrypoint [skip ci]'
          git push
