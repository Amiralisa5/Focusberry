name: Normalize Focusberry PWA

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ github.event.head_commit.message != 'chore(pwa): normalize entrypoint [skip ci]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix PWA entrypoint and cache version
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = Path('manifest.json')
          data = json.loads(manifest.read_text())
          data['start_url'] = './index.html'
          data['scope'] = './'
          manifest.write_text(json.dumps(data, indent=2) + '\n')

          sw = Path('sw.js')
          text = sw.read_text()
          text = text.replace("const CACHE = 'focusberry-v2';", "const CACHE = 'focusberry-v3';")
          sw.write_text(text)

          for name in ('pwa-fix.txt', 'pwa-fix-keep.txt', 'pwa-fix-2.txt', 'pwa-fix-3.txt', 'pwa-fix-4.txt'):
              Path(name).unlink(missing_ok=True)
          PY

      - name: Commit normalized PWA
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json sw.js
          git rm -f --ignore-unmatch pwa-fix.txt pwa-fix-keep.txt pwa-fix-2.txt pwa-fix-3.txt pwa-fix-4.txt
          git diff --cached --quiet && exit 0
          git commit -m 'chore(pwa): normalize entrypoint [skip ci]'
          git push
