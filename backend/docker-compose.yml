services:
  postgres:
    image: postgres:17-alpine
    container_name: focusberry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: focusberry
      POSTGRES_USER: focusberry
      POSTGRES_PASSWORD: focusberry
    ports:
      - "5432:5432"
    volumes:
      - focusberry_pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: focusberry-api
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=focusberry;Username=focusberry;Password=focusberry
      Jwt__Issuer: Focusberry
      Jwt__Audience: Focusberry
      Jwt__Secret: CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARACTERS
      Cors__Origins__0: https://amiralisa5.github.io
      Cors__Origins__1: http://localhost:5173
    ports:
      - "8080:8080"

volumes:
  focusberry_pgdata:
